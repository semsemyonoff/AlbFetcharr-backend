# CI for the AlbFetcharr backend.
#
# Lives in .github/workflows/ so it runs unchanged on BOTH GitHub Actions and
# Forgejo Actions (Forgejo scans .github/workflows/ by default). Keep it to
# standard actions and `ubuntu-latest` so it stays portable across both runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Lint/format only need ruff, not the full app deps (which pull yt-dlp and
      # the yandex-music-downloader tarball) — keep this job fast.
      - run: pip install ruff
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The suite mocks HTTP (responses) and never shells out to yt-dlp/ffmpeg,
      # so no system packages are needed — just the Python deps.
      - name: Install project (dev extras)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
